<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation Lifeline</title><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{background:#111827;color:#fff;font-family:Arial;margin:0}.w{max-width:1000px;margin:auto;padding:24px}.c{background:#1f2937;padding:16px;border-radius:12px;margin:12px}button{padding:10px 16px;background:#2563eb;color:#fff;border:0;border-radius:8px}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[s,setS]=React.useState(0);const[score,setScore]=React.useState(52);return <div className="w"><h1>🚚 Operation Lifeline: Supply Chain Crisis Lab</h1>{s===0&&<div className="c"><h2>Welcome</h2><button onClick={()=>setS(1)}>Start Simulation</button></div>}{s===1&&<div className="c"><h2>Company</h2><p>Industry: Electronics | Revenue: $2.4B | Crisis: Port Strike</p><button onClick={()=>{setScore(82);setS(2)}}>Respond</button></div>}{s===2&&<div className="c"><h2>Executive Dashboard</h2><p>Overall Crisis Score: {score}/100</p><p>Leadership: 84% | Negotiation:78% | Resilience:81%</p><p>Best Decision: Diversified suppliers.</p><p>Recommendation: Invest in AI forecasting.</p><button onClick={()=>location.reload()}>Replay</button></div>}</div>}ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script></body></html>
