<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Splitter & Merger Demo</title><style>body{font-family:Arial;background:#0f172a;color:#fff;padding:30px}.c{max-width:800px;margin:auto;background:#1e293b;padding:20px;border-radius:16px}.card{background:#334155;padding:15px;border-radius:10px;margin:15px 0}button{padding:10px 18px;background:#38bdf8;border:none;border-radius:8px;cursor:pointer}</style></head><body><div class="c"><h1>📄 PDF Splitter & Merger</h1><div class="card"><h3>Merge PDFs</h3><input type="file" id="m" accept=".pdf" multiple><br><br><button onclick="merge()">Merge (Demo)</button></div><div class="card"><h3>Split PDF</h3><input type="file" id="s" accept=".pdf"><br><br><input id="r" placeholder="Page range"><br><br><button onclick="split()">Split (Demo)</button></div><p id="o"></p><small>Demo UI only. Real PDF processing requires a PDF library.</small></div><script>function merge(){let f=m.files;if(!f.length)return alert("Select PDFs");o.innerHTML="Selected "+f.length+" PDF(s) for merging."}function split(){let f=s.files;if(!f.length)return alert("Select PDF");o.innerHTML="Selected "+f[0].name+" with range "+(r.value||"all")}</script></body></html>
