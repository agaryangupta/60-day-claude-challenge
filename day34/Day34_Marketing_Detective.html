<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Marketing Detective</title><style>body{margin:0;font-family:Arial;background:#0a1220;color:#eef}header{background:#142540;padding:20px}.c{max-width:1000px;margin:auto;padding:20px}.card{background:#162a45;border:1px solid #2d5475;border-radius:12px;padding:18px;margin:18px 0}button{padding:10px 16px;border:none;border-radius:8px;background:#2dd4ff;cursor:pointer}.p{height:10px;background:#233}.b{height:10px;width:0;background:#2ee59d;transition:.4s}</style></head><body><header><h1>🕵️ Marketing Detective</h1><p>Solve marketing mysteries through interactive investigation.</p></header><div class='c'><div class='p'><div id='bar' class='b'></div></div><div class='card'><h2>Case File</h2><p>Traffic increased by 40%, but sales fell by 18%.</p><button onclick='n()'>Start Investigation</button></div><div id='o'></div></div><script>let s=0;let d=[['Traffic Analysis','High bounce rate from ads'],['Audience','Wrong audience targeted'],['Landing Page','Slow page and weak CTA'],['Decision','Improve targeting and UX'],['Report','Case solved!']];function n(){if(s>=d.length)return;bar.style.width=((s+1)*20)+'%';let h='<div class=card><h2>'+d[s][0]+'</h2><p><b>Evidence:</b> '+d[s][1]+'</p><p><b>How to ask Claude:</b> Analyze this marketing data, find the root cause, and recommend improvements.</p>';if(s<4){h+='<button onclick=n()>Continue</button>';}else{h+='<h3>Detective Report</h3><ul><li>Root Cause: Poor targeting</li><li>Fix: Better audience + landing page</li><li>Expected Result: Higher conversions</li></ul><button onclick=location.reload()>Replay</button>';}h+='</div>';o.innerHTML=h;s++;}</script></body></html>
