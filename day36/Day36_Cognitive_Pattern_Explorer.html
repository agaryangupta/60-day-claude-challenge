<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cognitive Pattern Explorer</title><style>body{margin:0;font-family:Arial;background:#eef7f8;color:#233}header{background:#d9f3f4;padding:18px;text-align:center}.c{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:18px;margin:18px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}button{padding:10px 16px;border:none;border-radius:8px;background:#56b7c9;color:#fff;margin:6px;cursor:pointer}.p{height:10px;background:#d7e6e7}.b{height:10px;width:0;background:#4caf50;transition:.4s}</style></head><body><header><h1>🌿 Cognitive Pattern Explorer</h1><p>Educational self-reflection experience</p></header><div class=c><div class=p><div id=bar class=b></div></div><div id=app class=card><h2>Choose Mode</h2><button onclick="start('Calm')">Calm Mode</button><button onclick="start('Stress')">Stress Mode</button></div></div><script>let s=0,m='';const steps=['<h2>Chapter 1</h2><p>You face an unexpected deadline.</p><button onclick=n()>Plan Carefully</button><button onclick=n()>Act Immediately</button>','<h2>Chapter 2</h2><p>Choose your priority.</p><button onclick=n()>Logic</button><button onclick=n()>Balance</button><button onclick=n()>Feelings</button>','<h2>Chapter 3</h2><p>Select your thinking sequence.</p><button onclick=n()>Analyze → Decide → Act</button><button onclick=n()>Act → Learn</button>','<h2>Reflection Journal</h2><p>You often balance thoughtful analysis with action. This is a reflective exercise, not a diagnosis.</p><ul><li>Analytical:30%</li><li>Balanced:40%</li><li>Action-First:20%</li><li>Emotional:10%</li></ul><button onclick=location.reload()>Replay</button>'];function start(x){m=x;n()}function n(){bar.style.width=((s+1)*25)+"%";app.innerHTML="<div class=card><p><b>Mode:</b> "+m+"</p>"+steps[Math.min(s,3)]+"</div>";if(s<3)s++;}</script></body></html>
