<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Personal Financial Command Center</title><style>body{font-family:Arial;margin:0;background:#0f172a;color:#eee}header{background:#1e293b;padding:20px;text-align:center}.c{max-width:1000px;margin:auto;padding:20px}.card{background:#1e293b;padding:16px;border-radius:10px;margin:12px 0}input{padding:8px;width:100%;margin:6px 0}button{padding:10px 16px}#bar{height:16px;background:#22c55e;width:0%}</style></head><body><header><h1>💰 Personal Financial Command Center</h1></header><div class='c'><div class='card'>Income<input id='i' value='20000' type='number'>Expenses<input id='e' value='12000' type='number'>Goal<input id='g' value='100000' type='number'>Savings<input id='s' value='35000' type='number'><button onclick='calc()'>Generate Report</button></div><div class='card'><h3>Health Score</h3><div style='background:#334155;height:16px'><div id='bar'></div></div><p id='score'></p><ul id='tips'></ul><p id='sim'></p></div></div><script>function calc(){let i=+document.getElementById('i').value,e=+document.getElementById('e').value,g=+document.getElementById('g').value,s=+document.getElementById('s').value;let r=Math.max(0,i-e);let h=Math.min(100,Math.round((r/i*60)+(s/g*40)*100));bar.style.width=h+'%';score.innerHTML='Financial Health: '+h+'/100';tips.innerHTML='<li>Maintain emergency fund</li><li>Invest regularly</li><li>Track expenses monthly</li>';sim.innerHTML='What-if: Saving ₹'+(r+2000)+'/month helps reach your goal faster.';}calc();</script></body></html>
