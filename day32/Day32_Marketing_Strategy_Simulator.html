<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Think Like a Marketing Strategist</title><style>body{margin:0;font-family:Arial;background:#08131f;color:#eef}header{padding:20px;background:#0f2238;color:#6fe8ff}.container{max-width:1100px;margin:auto;padding:20px}.card{background:#11253c;border:1px solid #235a7d;border-radius:12px;padding:18px;margin:16px 0}button{padding:10px 16px;margin:6px;border:none;border-radius:8px;background:#19b5ff;color:#001;font-weight:bold;cursor:pointer}.progress{height:10px;background:#233;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#1de9b6;transition:.4s}.hidden{display:none}</style></head><body><header><h1>Think Like a Marketing Strategist: Grow This Brand</h1><p>Learn how marketers think before they create.</p></header><div class="container"><div class="progress"><div class="bar" id="bar"></div></div><div class="card" id="welcome"><h2>Select a Mode</h2><button onclick="start('Business')">🏢 My Business</button><button onclick="start('Personal Brand')">🙋 Personal Brand</button><button onclick="start('Random Client')">🎲 Random Client</button></div><div id="app" class="hidden"></div></div><script>let s=0,m='';const p=['Analyze audience','Choose platforms','Pick pillars','Build roadmap','Review growth'];function r(){bar.style.width=((s+1)*20)+'%';let a=document.getElementById('app');if(s==0)a.innerHTML='<div class=card><h2>'+m+'</h2><p>Audience: Young professionals<br>Budget:$5k</p><button onclick=next()>Continue</button></div>';else if(s==1)a.innerHTML='<div class=card><h2>Platforms</h2><p>LinkedIn, YouTube, Instagram</p><button onclick=next()>Next</button></div>';else if(s==2)a.innerHTML='<div class=card><h2>Content Pillars</h2><ul><li>Thought Leadership</li><li>Education</li><li>Behind the Scenes</li></ul><button onclick=next()>Next</button></div>';else if(s==3)a.innerHTML='<div class=card><h2>30-Day Roadmap</h2><ol><li>Week1 Positioning</li><li>Week2 Publish</li><li>Week3 Engage</li><li>Week4 Optimize</li></ol><button onclick=next()>Growth Report</button></div>';else a.innerHTML='<div class=card><h2>Growth Report</h2><p>Potential: High<br>Lesson: Be authentic, consistent, niche-focused.</p><button onclick=location.reload()>Replay</button></div>';}function start(x){m=x;welcome.classList.add('hidden');app.classList.remove('hidden');r()}function next(){s++;r()}</script></body></html>
