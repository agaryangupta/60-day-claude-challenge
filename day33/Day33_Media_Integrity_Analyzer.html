<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Integrity Analyzer</title><style>body{margin:0;font-family:Arial;background:#0b1220;color:#eef}header{background:#13233d;padding:20px}.container{max-width:1000px;margin:auto;padding:20px}.card{background:#162944;border:1px solid #2f5475;border-radius:12px;padding:18px;margin:18px 0}button{padding:10px 16px;border:none;border-radius:8px;background:#31c8ff;cursor:pointer}.progress{height:10px;background:#233}.bar{height:10px;width:0;background:#22e39c;transition:.4s}textarea{width:100%;height:120px;background:#0d1b2f;color:#fff}</style></head><body><header><h1>Media Integrity Analyzer</h1><p>Learn to evaluate information before believing it.</p></header><div class="container"><div class="progress"><div id="bar" class="bar"></div></div><div class="card"><h2>Paste a Claim</h2><textarea placeholder="Paste headline here"></textarea><br><button onclick="n()">Analyze</button></div><div id="out"></div></div><script>let s=0;const d=[['Source Check','Verify publisher'],['Evidence','Look for proof'],['Bias','Detect emotional language'],['Cross Verification','Compare trusted sources'],['Report','Credibility summary']];function n(){if(s>=d.length)return;bar.style.width=((s+1)*20)+'%';if(s<4){out.innerHTML='<div class=card><h2>'+d[s][0]+'</h2><p>'+d[s][1]+'</p><p><b>How to ask Claude:</b> Analyze this claim objectively and explain credibility.</p><button onclick=n()>Continue</button></div>';}else{out.innerHTML='<div class=card><h2>Media Integrity Report</h2><p>Credibility Score: 82/100</p><ul><li>Verify source.</li><li>Cross-check facts.</li><li>Avoid sensational claims.</li></ul><button onclick=location.reload()>Analyze Another</button></div>';}s++;}</script></body></html>
