<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Puzzle</title><style>body{margin:0;font-family:Arial;background:#0b1020;color:#eef}header{background:#16213a;padding:18px}.c{max-width:1000px;margin:auto;padding:20px}.card{background:#182844;border:1px solid #2d5078;border-radius:12px;padding:18px;margin:18px 0}button{padding:10px 16px;background:#4fd1ff;border:none;border-radius:8px;cursor:pointer}.p{height:10px;background:#233}.b{height:10px;width:0;background:#36e39c;transition:.4s}.blk{display:inline-block;padding:8px;margin:4px;background:#28476f;border-radius:6px}</style></head><body><header><h1>🧩 Prompt Puzzle</h1></header><div class=c><div class=card><label>Domain <select><option>Software</option><option>Marketing</option><option>Design</option></select></label><br><br><label>Difficulty <select><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><br><br><button onclick=n()>Start</button></div><div class=p><div id=bar class=b></div></div><div id=o></div></div><script>let s=0;const d=[["Build the Prompt"],["Clean the Prompt"],["Choose the Best Prompt"]];function n(){if(s<3){bar.style.width=((s+1)*33)+"%";o.innerHTML="<div class=card><h2>"+d[s][0]+"</h2><p>Desired Output: Professional response</p><span class=blk>Role</span><span class=blk>Context</span><span class=blk>Tone</span><span class=blk>Output Format</span><p>Weak Prompt: Do it.</p><p>Optimized Prompt: Act as an expert, use context and constraints.</p><p>Prompt Principle: Specificity improves AI quality.</p><button onclick=n()>Complete</button></div>";s++;}else{o.innerHTML="<div class=card><h2>Prompt Performance Report</h2><p>Score: 30/30</p><p>Rating: A+</p><p>Rank: Prompt Engineer</p><p>Prompt DNA: 🟩🟦🟩🟦🟨</p><button onclick=location.reload()>Replay</button></div>";bar.style.width="100%";}}</script></body></html>
