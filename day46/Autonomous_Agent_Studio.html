<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous Agent Studio</title><style>body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:24px}.c{max-width:900px;margin:auto}.card{background:#1e293b;padding:20px;border-radius:12px;margin:16px 0}button{padding:10px 16px}.log{background:#111827;padding:10px;border-radius:8px;min-height:180px}</style></head><body><div class="c"><h1>🤖 Autonomous Agent Studio</h1><div class="card"><h2>Interview</h2><p>Workflow: Research Assistant</p><p>Success: Accuracy ≥ 90%</p><p>Stop: Target score / Plateau</p><button onclick="run()">Run Demo</button></div><div class="card"><h2>Architecture</h2><pre>Planner → Executor → Evaluator ↺
           ↑          ↓
      Improver ← Critic
            ↓
     Final Reviewer</pre></div><div class="card"><h2>Execution Log</h2><div id="log" class="log"></div></div></div><script>async function wait(){return new Promise(r=>setTimeout(r,400));}async function run(){let log=document.getElementById("log");log.innerHTML="";let s=84;let last=0;let stable=0;for(let i=1;i<9;i++){await wait();s+=Math.floor(Math.random()*4);log.innerHTML+="<p><b>Round "+i+"</b> — Evaluator Score: "+s+"</p>";if(Math.abs(s-last)<2)stable++;else stable=0;if(s>=90){log.innerHTML+="<p><b>Stop:</b> Threshold reached.</p>";break;}if(stable>=2){log.innerHTML+="<p><b>Stop:</b> Plateau detected.</p>";break;}last=s;if(i===8)log.innerHTML+="<p><b>Safety Stop</b></p>";}}</script></body></html>
