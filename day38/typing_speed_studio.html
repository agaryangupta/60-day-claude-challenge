<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Speed Studio</title><style>body{margin:0;font-family:Arial;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.box{max-width:900px;width:92%;background:#1e293b;padding:24px;border-radius:18px}#text{background:#111827;padding:15px;border-radius:10px;line-height:1.8}textarea{width:100%;height:120px;margin-top:15px;border-radius:10px;padding:10px;font-size:16px}.stats{display:flex;gap:15px;flex-wrap:wrap;margin-top:15px}.card{background:#334155;padding:10px 15px;border-radius:10px}button{margin-top:15px;padding:10px 18px;border:none;border-radius:10px;background:#38bdf8;cursor:pointer}</style></head><body><div class="box"><h1>⌨️ Typing Speed Studio</h1><p>Offline demo.</p><div id="text">The quick brown fox jumps over the lazy dog. Practice typing accurately before increasing your speed.</div><textarea id="input" placeholder="Start typing here..."></textarea><div class="stats"><div class="card">Time: <span id="time">0</span>s</div><div class="card">WPM: <span id="wpm">0</span></div><div class="card">Accuracy: <span id="acc">100</span>%</div></div><button onclick="restart()">Restart</button></div><script>const sample=text.innerText;let start=null,timer;input.oninput=()=>{if(!start){start=Date.now();timer=setInterval(update,1000)}update()};function update(){let typed=input.value,e=Math.max(1,(Date.now()-start)/1000);time.textContent=Math.floor(e);let c=0;for(let i=0;i<typed.length;i++)if(typed[i]===sample[i])c++;wpm.textContent=Math.round((typed.trim().length/5)/(e/60));let a=typed.length?Math.round(c/typed.length*100):100;acc.textContent=a;if(typed===sample){clearInterval(timer);alert("Finished! WPM: "+wpm.textContent+" Accuracy: "+a+"%")}}function restart(){clearInterval(timer);start=null;input.value="";time.textContent=0;wpm.textContent=0;acc.textContent=100;input.focus()}</script></body></html>
